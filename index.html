<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="description" content="QMS Web Client" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width"
    />

    <link rel="icon" type="image/png" sizes="128x128" href="/icons/favicon-128x128.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="icon" type="image/ico" href="/favicon.ico" />

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <title>QMS Web Client</title>

    <!-- Apply dark mode before the app mounts to avoid a light flash.
         Mirrors src/utils/theme.js (localStorage 'theme': light|dark|system). -->
    <script>
      ;(function () {
        try {
          var mode = localStorage.getItem('theme') || 'system'
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body class="tw:overflow-hidden">
    <div id="app" class="tw:bg-main tw:text-on-main tw:h-screen tw:flex tw:print:hidden"></div>
    <div id="print-portal"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
